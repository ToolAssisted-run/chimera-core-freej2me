name: chimera waterbox core

# Builds the core from a fresh clone, tests it, and publishes the package.
#
# Everything the tests need is this repository's own: the test MIDlet
# (tests/midlet) reads the keys and the touch screen, draws, saves a record
# store and plays MIDI, tones and WAV sound. So every test runs here, as
# before a push:
#   - the submodules are the pinned commits with the patches applied, and the
#     package declares the controls the core has;
#   - the MIDlet runs: keys, touch, sound, the screen size setting, Japanese
#     text; its record store is exported and a project starts from it; the
#     Java heap is the memory RAM Search reads, and reading it changes nothing;
#   - the sandbox runs are the same again, through savestates around every
#     frame, in a new host, from a state file in another process and after a
#     rewind;
#   - the game: tests SKIP here: no commercial game is on a runner;
#   - the native runner runs the MIDlet (it is not compared with the sandbox:
#     natively the game's threads run on the host's clock);
#   - the package plays a project in Chimera's headless runner;
#   - Chimera's own checks of the package pass.
#
# OpenJDK is built here from its source (about 10 minutes on a runner).

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      kind:
        description: 'dev (rolling) or nightly (dated). Blank means dev.'
        required: false
        default: ''
        type: string
  schedule:
    # 05:35 UTC. A nightly is published only when main moved since the last
    # one; the shared publishing workflow checks.
    - cron: '5 6 * * *'

# Keyed by the event as well as the branch: otherwise the nightly schedule
# and a push to main cancel each other, and the publishing that depends on
# the cancelled run is skipped with nothing reporting a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CHIMERA_REF: main

jobs:

  gate:
    name: build and test (the sandbox, the package, Chimera's package checks)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Check out Chimera
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: recursive

      - name: Install build dependencies
        # OpenJDK's configure asks for the CUPS, fontconfig, X11 and ALSA
        # headers even for a build without a display; the core links none of
        # those libraries. The DejaVu fonts go into the core.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential cmake pkg-config python3 curl xz-utils patch mono-complete xvfb libgl1-mesa-dev libegl-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev libasound2-dev libcups2-dev libfontconfig-dev \
            zip unzip autoconf automake libtool openjdk-21-jdk-headless fonts-dejavu-core fonts-dejavu-extra fonts-ipaexfont-gothic linux-libc-dev

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Build Chimera's engine
        working-directory: chimera-checkout
        run: |
          meson setup build/meson-linux --prefix "$PWD/build" --libdir dll
          meson compile -C build/meson-linux
          meson install -C build/meson-linux

      - name: Build Chimera's interface
        working-directory: chimera-checkout
        run: dotnet build source/gui/Chimera.sln -c Release /nodeReuse:false -p:UseSharedCompilation=false

      - name: Cache miniBox's sandbox toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (the sandbox, and its C++ toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Lay the patches over the submodules
        run: sh ./waterbox/apply-patches.sh

      - name: Build OpenJDK (Zero) for this machine
        env:
          BOOT_JDK: /usr/lib/jvm/java-21-openjdk-amd64
        run: sh ./waterbox/build-jdk.sh

      - name: Build the Java half, the guest, the native runner and the test MIDlet
        env:
          BOOT_JDK: /usr/lib/jvm/java-21-openjdk-amd64
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          sh ./waterbox/build-java.sh
          sh ./waterbox/build-guest.sh -m "$mb"
          sh ./waterbox/build-native.sh -m "$mb"
          sh ./tests/midlet/build.sh

      - name: Build the sandboxed core and the package
        # The commit is the version the package is stamped with: this is the
        # build that is published, so it is what a movie can name. A package
        # built by hand is stamped "+local" instead.
        env:
          CORE_VERSION: ${{ github.sha }}
          BOOT_JDK: /usr/lib/jvm/java-21-openjdk-amd64
        run: sh ./waterbox/build-package.sh -r "$GITHUB_WORKSPACE/chimera-checkout"

      - name: Run the test script
        # A run in which these did not pass has tested nothing, so they are
        # asked for by name.
        env:
          CHIMERA_ROOT: ${{ github.workspace }}/chimera-checkout
        run: |
          rc=0
          bash ./waterbox/run-gate.sh > gate.out 2>&1 || rc=$?
          cat gate.out
          [ "$rc" -eq 0 ]
          for t in source:patched package:fresh package:controls package:key-names j2me:runs j2me:keys j2me:touch \
                   j2me:sound j2me:effects j2me:screen-size j2me:japanese save:export save:import save:refused memory:heap memory:looking box:again box:rerecord box:session box:resume box:rewind \
                   refused:no-game native:runs engine:boot engine:resume; do
            grep -q "^$t  *PASS " gate.out || { echo "$t did not pass"; exit 1; }
          done

      - name: Chimera's checks of the package
        working-directory: chimera-checkout
        env:
          CHIMERA_CORES_DIR: ${{ github.workspace }}/chimera-checkout/build/Cores
        run: |
          dotnet test source/gui/Chimera.Tests.Client.Common/Chimera.Tests.Client.Common.csproj \
            -c Release --nologo \
            --filter "FullyQualifiedName~InstalledCorePackagesTests|FullyQualifiedName~MnemonicUniquenessTests"

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: freej2me-${{ github.sha }}
          path: chimera-checkout/build/Cores/freej2me.chimeraCore
          if-no-files-found: error

      - name: Upload the test output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: gate.out

  publish:
    # What passed above, published as this core's own release: a rolling `dev`
    # on every push to main, a dated `nightly-YYYY-MM-DD` from the scheduled
    # run, through the one workflow every Chimera core publishes with.
    name: publish
    needs: [ gate ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
    with:
      core-id: freej2me
      artifact: freej2me-${{ github.sha }}
      package: freej2me.chimeraCore
      kind: ${{ github.event.inputs.kind }}
